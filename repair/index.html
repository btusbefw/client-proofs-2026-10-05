<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repair estimate · working prototype</title><style>*{box-sizing:border-box}body{font:16px system-ui;color:#182e3d;background:#f4f6f5;margin:0}header{background:white;padding:24px 6%;border-bottom:1px solid #dbe3df;font-size:21px;font-weight:700}main{max-width:1050px;margin:35px auto;padding:0 24px}nav{display:flex;gap:12px;margin-bottom:30px}button{font:inherit;cursor:pointer;padding:11px 17px;border:1px solid #cbd6d0;border-radius:5px;background:white;color:#234237}button.primary{background:#2c6653;color:white;border-color:#2c6653}h1{font:36px Georgia;margin-bottom:10px}p{color:#67796e;line-height:1.55}.grid{display:grid;grid-template-columns:1.3fr .8fr;gap:25px}.panel{background:white;border:1px solid #dbe3df;border-radius:8px;padding:25px}label{display:block;font-size:14px;margin-bottom:18px}select,input,textarea{width:100%;margin-top:7px;padding:12px;border:1px solid #cbd6d0;border-radius:5px;background:white;font:inherit}textarea{height:150px;font:13px monospace}h2{font-size:19px}.amount{font-size:46px;font-weight:650;letter-spacing:-2px;margin:15px 0}small{color:#67796e;font-size:12px}.status{background:#e8f3eb;padding:15px;margin-top:15px;border-radius:5px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;border-bottom:1px solid #dbe3df;padding:15px 10px}.table{overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.hidden{display:none}a{color:#2c6653}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}h1{font-size:30px}nav{flex-wrap:wrap}.amount{font-size:39px}.panel{padding:20px}}</style></head><body><header>Repair estimate</header><main><p style="font-size:12px">Prototype built for this request · fictional prices · browser-local leads. Email delivery and Google Sheets sync are not connected.</p><nav><button data-view="quote">Get an estimate</button><button data-view="pricing">Edit pricing CSV</button><button data-view="leads">Lead tracker</button></nav><div id="app"></div></main><script>
let prices=[{brand:'Apple',model:'iPhone 14',issue:'Screen replacement',price:199},{brand:'Apple',model:'iPhone 14',issue:'Battery replacement',price:99},{brand:'Samsung',model:'Galaxy S23',issue:'Screen replacement',price:229},{brand:'Apple',model:'iPad Air',issue:'Screen replacement',price:249}];let leads=[];let view='quote';const app=document.getElementById('app'),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(x);document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});function render(){if(view==='quote'){app.innerHTML=`<h1>What needs fixing?</h1><p>Select your device and issue for an estimated repair price.</p><div class="grid"><section class="panel"><form id="quote"><label>Brand<select id="brand">${[...new Set(prices.map(p=>p.brand))].map(v=>`<option>${esc(v)}</option>`).join('')}</select></label><label>Model<select id="model"></select></label><label>Issue<select id="issue"></select></label><h2>Send your estimate</h2><div class="row"><label>Name<input name="name" required value="Alex Sample"></label><label>Mobile<input name="mobile" type="tel" required value="0400000000"></label></div><label>Email<input name="email" type="email" required value="alex@example.test"></label><button class="primary">Save fictional quote request</button><div id="saved"></div></form></section><aside class="panel"><h2>Your estimate</h2><div class="amount" id="price"></div><p>GST inclusive · estimate only</p><small>Final pricing requires assessment by the repair team. Demonstration prices are fictional.</small><p><a href="../questionnaires/">Second working form example</a></p></aside></div>`;document.getElementById('brand').onchange=models;document.getElementById('model').onchange=issues;document.getElementById('issue').onchange=cost;models();document.getElementById('quote').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const p=selected();leads.unshift({...p,name:f.get('name'),mobile:f.get('mobile'),email:f.get('email'),date:new Date().toISOString()});document.getElementById('saved').innerHTML='<p class="status">Saved to the demonstration lead tracker. No email was sent.</p>'}}
if(view==='pricing'){app.innerHTML=`<h1>Update pricing in one place.</h1><p>Import the same brand, model, issue and price structure in bulk.</p><section class="panel"><label>CSV (demo accepts unquoted fields, one record per line)<textarea id="csv">brand,model,issue,price\n${prices.map(p=>[p.brand,p.model,p.issue,p.price].join(',')).join('\n')}</textarea></label><button class="primary" id="import">Apply CSV</button><p id="status"></p><small>The WordPress version will include a validated file importer and admin permissions.</small></section>`;document.getElementById('import').onclick=()=>{const rows=document.getElementById('csv').value.trim().split(/\r?\n/);if(rows.shift()!=='brand,model,issue,price')return document.getElementById('status').textContent='Use the specified header.';const out=rows.map(row=>{const [brand,model,issue,price]=row.split(',');return{brand,model,issue,price:Number(price)}});if(out.some(r=>!r.brand||!r.model||!r.issue||!Number.isFinite(r.price)||r.price<0))return document.getElementById('status').textContent='Invalid row: all labels and a nonnegative price are required.';prices=out;document.getElementById('status').textContent=`${prices.length} pricing rows applied.`}}
if(view==='leads'){app.innerHTML=`<h1>Quote requests</h1><p>${leads.length} request(s) saved in this demonstration session.</p><section class="panel table"><table><thead><tr><th>Contact</th><th>Device / issue</th><th>Estimate</th><th>Date</th></tr></thead><tbody>${leads.map(l=>`<tr><td>${esc(l.name)}<br>${esc(l.email)}<br>${esc(l.mobile)}</td><td>${esc(l.brand+' '+l.model)}<br>${esc(l.issue)}</td><td>${money(l.price)}</td><td>${new Date(l.date).toLocaleString('en-AU')}</td></tr>`).join('')}</tbody></table><p><small>Production deliverable: server-side storage, email alert and authorized Google Sheet sync with retries. This prototype performs none of those external actions.</small></p></section>`}}
function models(){const b=document.getElementById('brand').value;document.getElementById('model').innerHTML=[...new Set(prices.filter(p=>p.brand===b).map(p=>p.model))].map(v=>`<option>${esc(v)}</option>`).join('');issues()}function issues(){const b=document.getElementById('brand').value,m=document.getElementById('model').value;document.getElementById('issue').innerHTML=prices.filter(p=>p.brand===b&&p.model===m).map(p=>`<option>${esc(p.issue)}</option>`).join('');cost()}function selected(){return prices.find(p=>p.brand===document.getElementById('brand').value&&p.model===document.getElementById('model').value&&p.issue===document.getElementById('issue').value)}function cost(){document.getElementById('price').textContent=money(selected().price)}render();
</script></body></html>
