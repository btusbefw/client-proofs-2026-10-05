<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionnaires → demandes → contacts · Démonstration CDRXRX</title><style>
:root{--ink:#192640;--muted:#687487;--brand:#6254df;--line:#dfe4ec;--bg:#f4f6fa}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px system-ui;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;padding:10px 14px;border-radius:9px;color:var(--ink)}button.primary{background:var(--brand);color:white;border-color:var(--brand)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b4acff}header{padding:22px 5%;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}header strong{font-size:22px;letter-spacing:-.6px}.badge{font-size:12px;padding:6px 10px;border-radius:20px;background:#eeeaff;color:#5041c8}.note{margin:18px 5%;color:var(--muted);font-size:13px}nav{margin:0 5%;display:flex;gap:8px;flex-wrap:wrap}nav button.active{background:var(--ink);color:white}main{margin:22px 5%;max-width:1500px}h1{font-size:29px;letter-spacing:-1px;margin:0 0 5px}h2{font-size:18px;margin:0 0 18px}p{line-height:1.55}.muted{color:var(--muted)}.panel,.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;font-weight:600;margin-bottom:14px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:white;color:var(--ink)}textarea{min-height:80px}small{color:var(--muted)}.question{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.question div{max-width:80%}.question small{display:block;margin-top:5px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.column{background:#e9edf4;border-radius:14px;padding:16px;min-height:340px}.column h2{display:flex;justify-content:space-between}.card{padding:16px;margin-bottom:12px}.card p{margin:6px 0;font-size:13px}.card select{padding:6px;font-size:12px}.count{font-size:12px;background:white;padding:3px 8px;border-radius:20px}.success{background:#e4f7ef;color:#176447;border-radius:8px;padding:12px}.share{display:flex;gap:18px;align-items:center;word-break:break-all;margin-top:18px}.share img{width:105px;height:105px;background:white}.contact{padding:16px 0;border-bottom:1px solid var(--line)}.contact b{display:block}.contacts{max-width:780px}.hidden{display:none}@media(max-width:780px){.grid,.kanban,.fields{grid-template-columns:1fr}header{padding:18px 5%}h1{font-size:25px}.toolbar{align-items:flex-start;flex-direction:column}.share{align-items:flex-start}}
</style></head><body><header><strong>Questionnaires</strong><span class="badge">Exemple interactif</span><span class="muted">CDRXRX</span></header><p class="note">Exemple créé pour l’annonce · données fictives et stockage local. Version serveur à livrer après accord.</p><nav><button class="active" data-view="builder">01 · Concevoir</button><button data-view="respond">02 · Répondre</button><button data-view="pipeline">03 · Pipeline</button><button data-view="contacts">04 · Contacts</button></nav><main id="app"></main><script>
const initial=[{id:1,name:'Camille Martin',email:'camille@example.test',company:'Atelier Nord',status:'Nouvelle demande',owner:'Non attribué',answers:{Besoin:'Créer un portail client'}},{id:2,name:'Sofia Bernard',email:'sofia@example.test',company:'Maison Forma',status:'En cours',owner:'Cédric',answers:{Besoin:'Automatiser les demandes'}},{id:3,name:'Louis Petit',email:'louis@example.test',company:'Studio Alba',status:'Traité',owner:'Équipe',answers:{Besoin:'Ajouter des questionnaires'}}];
let requests=JSON.parse(localStorage.getItem('flux-demo-requests')||'null')||initial;let questions=[{label:'Besoin',type:'long',required:true},{label:'Priorité',type:'single',required:true}];let title='Demande de projet';let view=new URLSearchParams(location.search).has('respond')?'respond':'builder';const statuses=['Nouvelle demande','En cours','Traité'];const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const types={text:'Texte court',long:'Texte long',single:'Choix unique',multiple:'Choix multiple',dropdown:'Liste déroulante',date:'Date',number:'Nombre'};const app=document.getElementById('app');
function persist(){localStorage.setItem('flux-demo-requests',JSON.stringify(requests))}function setView(v){view=v;render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function field(q,i){const a=`name="q${i}" ${q.required?'required':''}`;if(q.type==='long')return `<textarea ${a} placeholder="Décrivez votre besoin"></textarea>`;if(['single','dropdown'].includes(q.type))return `<select ${a}><option value="">Choisir…</option><option>Normal</option><option>Urgent</option><option>À planifier</option></select>`;if(q.type==='multiple')return `<select ${a} multiple aria-label="${esc(q.label)}"><option>Design</option><option>Développement</option><option>Automatisation</option></select>`;return `<input ${a} type="${q.type==='text'?'text':q.type}" ${q.type==='number'?'min="0"':''}>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
if(view==='builder'){app.innerHTML=`<div class="toolbar"><div><h1>Demandes de projet</h1><p class="muted">Une demande devient une carte et un contact.</p></div><button id="reset">Réinitialiser la démo</button></div><div class="grid"><section class="panel"><h2>Conception du questionnaire</h2><label>Titre<input id="title" value="${esc(title)}"></label><div>${questions.map((q,i)=>`<div class="question"><div><b>${esc(q.label)}</b><small>${types[q.type]} · ${q.required?'Obligatoire':'Facultatif'}</small></div><button data-remove="${i}" aria-label="Supprimer ${esc(q.label)}">×</button></div>`).join('')}</div><form id="add"><div class="fields" style="margin-top:20px"><label>Libellé<input name="label" required placeholder="Date souhaitée"></label><label>Type<select name="type">${Object.entries(types).map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></label></div><label><input name="required" type="checkbox" style="width:auto"> Obligatoire</label><button class="primary">Ajouter une question</button></form></section><section class="panel"><h2>Tester le parcours</h2><p>1. Ajoutez une question.<br>2. Envoyez une réponse fictive.<br>3. Attribuez la carte et changez son statut.<br>4. Répondez deux fois avec le même email : le contact reste unique.</p><button class="primary" id="try">Ouvrir le formulaire</button><div class="share"><img src="qr.svg" alt="QR code du questionnaire de démonstration"><div><b>Partage du questionnaire témoin</b><p><a href="?respond=1">Lien public et QR réel</a></p><small>Le générateur multi-questionnaires fera partie de la version serveur.</small></div></div></section></div>`;document.getElementById('title').oninput=e=>title=e.target.value;document.getElementById('add').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);questions.push({label:f.get('label'),type:f.get('type'),required:!!f.get('required')});render()};app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{questions.splice(+b.dataset.remove,1);render()});document.getElementById('try').onclick=()=>setView('respond');document.getElementById('reset').onclick=()=>{requests=structuredClone(initial);persist();render()}}
if(view==='respond'){app.innerHTML=`<div class="grid"><section class="panel"><h1>${esc(title)}</h1><p class="muted">Tous les champs marqués * sont obligatoires.</p><form id="answer"><div class="fields"><label>Nom *<input name="name" required value="Alex Demo"></label><label>Email *<input name="email" type="email" required value="alex@example.test"></label></div><label>Organisation<input name="company" value="Studio Démo"></label>${questions.map((q,i)=>`<label>${esc(q.label)} ${q.required?'*':''}${field(q,i)}</label>`).join('')}<button class="primary">Envoyer la demande fictive</button></form></section><aside class="panel"><h2>Votre demande</h2><p>Votre réponse apparaîtra dans le pipeline. Les demandes partageant le même email seront regroupées sous un contact.</p><p class="muted">N’utilisez aucune donnée réelle dans cette démonstration publique.</p></aside></div>`;document.getElementById('answer').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);requests.unshift({id:Date.now(),name:f.get('name'),email:f.get('email').trim().toLowerCase(),company:f.get('company'),status:statuses[0],owner:'Non attribué',answers:Object.fromEntries(questions.map((q,i)=>[q.label,f.getAll('q'+i).join(', ')]))});persist();setView('pipeline')}}
if(view==='pipeline'){app.innerHTML=`<div class="toolbar"><div><h1>Pipeline des demandes</h1><p class="muted">${requests.length} demandes · chaque réponse reste liée à son contact.</p></div><button id="new">Nouvelle réponse fictive</button></div><div class="kanban">${statuses.map(s=>`<section class="column"><h2>${s}<span class="count">${requests.filter(r=>r.status===s).length}</span></h2>${requests.filter(r=>r.status===s).map(r=>`<article class="card"><b>${esc(r.name)}</b><p class="muted">${esc(r.email)} · ${esc(r.company)}</p>${Object.entries(r.answers).map(([k,v])=>`<p><b>${esc(k)} :</b> ${esc(v)}</p>`).join('')}<label>Responsable<select data-owner="${r.id}">${['Non attribué','Cédric','Équipe'].map(o=>`<option ${r.owner===o?'selected':''}>${o}</option>`).join('')}</select></label><label>Statut<select data-status="${r.id}">${statuses.map(o=>`<option ${r.status===o?'selected':''}>${o}</option>`).join('')}</select></label></article>`).join('')}</section>`).join('')}</div>`;app.querySelectorAll('[data-owner]').forEach(s=>s.onchange=()=>{requests.find(r=>r.id==s.dataset.owner).owner=s.value;persist()});app.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>{requests.find(r=>r.id==s.dataset.status).status=s.value;persist();render()});document.getElementById('new').onclick=()=>setView('respond')}
if(view==='contacts'){const emails=[...new Set(requests.map(r=>r.email.trim().toLowerCase()))];app.innerHTML=`<h1>Contacts sans doublon</h1><p class="muted">${emails.length} contacts pour ${requests.length} demandes · regroupement par email.</p><section class="panel contacts">${emails.map(email=>{const rs=requests.filter(r=>r.email.trim().toLowerCase()===email);return `<article class="contact"><b>${esc(rs[0].name)}</b><p class="muted">${esc(email)} · ${esc(rs[0].company)}</p><span class="badge">${rs.length} demande${rs.length>1?'s':''}</span>${rs.map(r=>`<p>${esc(title)} · ${r.status} · ${r.owner}</p>`).join('')}</article>`}).join('')}</section>`}}
render();</script></body></html>
